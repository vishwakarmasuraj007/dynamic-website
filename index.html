<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dynamic Website</title>

    <link rel="stylesheet" href="style.css">
</head>

<body bgcolor="cyan">

    <!-- Navbar -->
    <nav class="navbar">

        <h2>MyWebsite</h2>

        <div class="nav-links">
            <a href="#home">Home</a>
            <a href="#services">Services</a>
            <a href="#about">About</a>
        </div>

        <button id="themeButton">🌙</button>

    </nav>


    <!-- Hero Section -->
    <section id="home" class="hero">

        <div>

            <h1>Welcome to My Dynamic Website</h1>

            <p id="welcomeText">
                Loading...
            </p>

            <button onclick="showMessage()">
                Click Me
            </button>

        </div>

    </section>


    <!-- Counter Section -->
    <section class="counter">

        <h2>Website Visitors</h2>

        <h1 id="visitorCount">0</h1>

    </section>


    <!-- Services -->
    <section id="services" class="services">

        <h2>Our Services</h2>

        <div id="serviceContainer" class="cards">
            <!-- JavaScript will add cards here -->
        </div>

    </section>


    <!-- About -->
    <section id="about" class="about">

        <h2>About Us</h2>

        <p>
            This website is created using HTML, CSS and JavaScript.
        </p>

        <p id="currentTime"></p>

    </section>


    <footer>

        <p>© 2026 MyWebsite</p>

    </footer>


    <script src="script.js"></script>

</body>
</html>
